<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Flores Amarillas para Ti 🌻</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #030303;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Frases y elementos orbitantes */
        .floating-item {
            position: absolute;
            z-index: 5;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .orbit-phrase {
            font-family: 'Caveat', cursive;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff4a3;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.9), 0 0 20px rgba(255, 170, 0, 0.6);
            white-space: nowrap;
        }

        .orbit-flower {
            font-size: 1.7rem;
            filter: drop-shadow(0 0 8px rgba(255, 220, 50, 0.9));
            animation: pulse 2.5s infinite ease-in-out alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1.15);
            }
        }

        /* Botón flotante para abrir la carta */
        #open-letter-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: linear-gradient(135deg, #ffd700, #ff9800);
            color: #2b1700;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.7), 0 4px 15px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #open-letter-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* Modal / Carta de amor */
        .letter-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .letter-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .card {
            background: linear-gradient(145deg, #fffdf0, #ffeaa7);
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 30px 24px;
            color: #3b2a05;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.4);
            border: 3px solid #ffde59;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .letter-modal.active .card {
            transform: scale(1);
        }

        .card h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #c47c00;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #574116;
            margin: 15px 0;
            font-weight: 400;
        }

        .card-footer-sign {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #c47c00;
            margin-top: 10px;
        }

        .card-sunflowers {
            font-size: 2.2rem;
            margin: 10px 0;
        }

        .close-btn {
            margin-top: 15px;
            background: #c47c00;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Aviso inicial de audio (pantalla de toque) */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }

        #start-screen h1 {
            font-family: 'Great Vibes', cursive;
            color: #ffd700;
            font-size: 3rem;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        #start-screen p {
            font-size: 1rem;
            color: #bbb;
        }

        .heart-tap {
            font-size: 3rem;
            margin: 20px 0;
            animation: beat 1s infinite alternate;
        }

        @keyframes beat {
            to {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div id="start-screen">
        <h1>Para Alguien Especial</h1>
        <div class="heart-tap">🌻💛</div>
        <p>Toca la pantalla para abrir</p>
    </div>

    <div id="canvas-container"></div>

    <div id="labels-container"></div>

    <button id="open-letter-btn">
        <span>Abrir Carta</span> 💌
    </button>

    <div class="letter-modal" id="letter-modal">
        <div class="card">
            <div class="card-sunflowers">🌻✨🌻</div>
            <h2>Mi princesa</h2>
            <p>
                Estas flores amarillas son como tú: radiantes, cálidas y llenas de luz. Gracias por ser la luz que
                ilumina mi mundo
                y gracias por todo lo que siempre haces por mi.
            </p>
            <div class="card-footer-sign">Te Amo Mucho</div>
            <button class="close-btn" id="close-letter-btn">Cerrar</button>
        </div>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source
            src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3"
            type="audio/mpeg">
    </audio>

    <script>
        // --- FRASES Y ELEMENTOS DE LA GALAXIA ---
        const orbitData = [
            { text: "Eres mi sol ☀️", type: "phrase", radius: 5.5, speed: 0.25, angle: 0 },
            { text: "🌻", type: "flower", radius: 4.5, speed: -0.3, angle: 1.2 },
            { text: "Te amo 💛", type: "phrase", radius: 7.0, speed: 0.18, angle: 2.3 },
            { text: "Amor de mi vida ✨", type: "phrase", radius: 6.2, speed: -0.22, angle: 3.5 },
            { text: "💐", type: "flower", radius: 5.0, speed: 0.35, angle: 4.2 },
            { text: "Eres preciosa 💫", type: "phrase", radius: 8.0, speed: 0.15, angle: 5.1 },
            { text: "Me encantas 🌻", type: "phrase", radius: 6.8, speed: -0.28, angle: 0.8 },
            { text: "Siempre juntos 💖", type: "phrase", radius: 7.5, speed: 0.2, angle: 2.9 },
            { text: "Eres mi todo ✨", type: "phrase", radius: 8.5, speed: -0.16, angle: 4.8 },
            { text: "🌼", type: "flower", radius: 3.8, speed: 0.4, angle: 1.8 }
        ];

        // --- CONFIGURACIÓN THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 7.5, 11);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 1. GALAXIA DE PARTÍCULAS DORADAS (ESPIRAL) ---
        const galaxyParams = {
            count: 22000,
            size: 0.035,
            radius: 12,
            branches: 4,
            spin: 1.3,
            randomness: 0.5,
            power: 4,
            insideColor: '#fff5aa',
            outsideColor: '#d4af37'
        };

        const galaxyGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(galaxyParams.count * 3);
        const colors = new Float32Array(galaxyParams.count * 3);

        const colorInside = new THREE.Color(galaxyParams.insideColor);
        const colorOutside = new THREE.Color(galaxyParams.outsideColor);

        for (let i = 0; i < galaxyParams.count; i++) {
            const i3 = i * 3;
            const r = Math.pow(Math.random(), galaxyParams.power) * galaxyParams.radius;
            const spinAngle = r * galaxyParams.spin;
            const branchAngle = ((i % galaxyParams.branches) / galaxyParams.branches) * Math.PI * 2;

            const randomX = (Math.random() - 0.5) * galaxyParams.randomness * r;
            const randomY = (Math.random() - 0.5) * 0.4 * (1 - r / galaxyParams.radius);
            const randomZ = (Math.random() - 0.5) * galaxyParams.randomness * r;

            positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
            positions[i3 + 1] = randomY;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

            // Gradiente de color centro -> borde
            const mixedColor = colorInside.clone().lerp(colorOutside, r / galaxyParams.radius);
            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Generar textura de partícula circular suave
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(255,220,100,0.8)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        const particleTexture = createParticleTexture();

        const galaxyMaterial = new THREE.PointsMaterial({
            size: galaxyParams.size,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true,
            map: particleTexture,
            transparent: true
        });

        const galaxy = new THREE.Points(galaxyGeometry, galaxyMaterial);
        scene.add(galaxy);

        // --- 2. CORAZÓN CENTRAL EN 3D ---
        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 0.25, y + 0.25);
        heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
        heartShape.bezierCurveTo(x - 0.35, y, x - 0.35, y + 0.35, x - 0.35, y + 0.35);
        heartShape.bezierCurveTo(x - 0.35, y + 0.55, x - 0.15, y + 0.77, x + 0.25, y + 1.0);
        heartShape.bezierCurveTo(x + 0.65, y + 0.77, x + 0.85, y + 0.55, x + 0.85, y + 0.35);
        heartShape.bezierCurveTo(x + 0.85, y + 0.35, x + 0.85, y, x + 0.5, y);
        heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

        const heartPointsGeom = new THREE.BufferGeometry();
        const heartPts = [];
        const heartColors = [];

        for (let i = 0; i < 900; i++) {
            const pt = heartShape.getPoint(Math.random());
            heartPts.push(
                (pt.x - 0.25) * 2.8 + (Math.random() - 0.5) * 0.2,
                (pt.y - 0.4) * 2.8 + (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.4
            );
            heartColors.push(1, 0.9, 0.3);
        }

        heartPointsGeom.setAttribute('position', new THREE.Float32BufferAttribute(heartPts, 3));
        heartPointsGeom.setAttribute('color', new THREE.Float32BufferAttribute(heartColors, 3));

        const heartMat = new THREE.PointsMaterial({
            size: 0.08,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false,
            vertexColors: true
        });

        const heartMesh = new THREE.Points(heartPointsGeom, heartMat);
        heartMesh.position.set(0, 1.8, 0);
        heartMesh.rotation.z = Math.PI; // Invertir forma
        scene.add(heartMesh);

        // --- DOM LABELS (FRASES Y FLORES) ---
        const labelsContainer = document.getElementById('labels-container');
        const labelElements = orbitData.map(item => {
            const el = document.createElement('div');
            el.className = `floating-item ${item.type === 'phrase' ? 'orbit-phrase' : 'orbit-flower'}`;
            el.textContent = item.text;
            labelsContainer.appendChild(el);
            return { el, data: item };
        });

        // --- CONTROLES TÁCTILES / ROTACIÓN CON EL DEDO ---
        let isDragging = false;
        let previousTouchX = 0;
        let targetRotationY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousTouchX = e.touches[0].clientX;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - previousTouchX;
                targetRotationY += deltaX * 0.005;
                previousTouchX = e.touches[0].clientX;
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Soporte para ratón en PC
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousTouchX = e.clientX;
        });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousTouchX;
                targetRotationY += deltaX * 0.005;
                previousTouchX = e.clientX;
            }
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // --- INTERACTIVIDAD MODAL & AUDIO ---
        const startScreen = document.getElementById('start-screen');
        const audio = document.getElementById('bg-music');
        const openBtn = document.getElementById('open-letter-btn');
        const closeBtn = document.getElementById('close-letter-btn');
        const modal = document.getElementById('letter-modal');

        startScreen.addEventListener('click', () => {
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 500);
            audio.play().catch(() => console.log("Audio requiere interacción"));
        });

        openBtn.addEventListener('click', () => modal.classList.add('active'));
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));

        // --- BUCLE DE ANIMACIÓN ---
        const clock = new THREE.Clock();
        const tempVec = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotación continua + interacción táctil
            galaxy.rotation.y = elapsedTime * 0.05 + targetRotationY;

            // Pulso suave del corazón central
            const heartScale = 1 + Math.sin(elapsedTime * 3) * 0.08;
            heartMesh.scale.set(heartScale, heartScale, heartScale);

            // Posicionamiento de frases y flores orbitantes proyectadas a 2D
            labelElements.forEach(({ el, data }) => {
                const currentAngle = data.angle + elapsedTime * data.speed * 0.4 + targetRotationY;
                const x = Math.cos(currentAngle) * data.radius;
                const z = Math.sin(currentAngle) * data.radius;
                const y = Math.sin(elapsedTime * 1.5 + data.angle) * 0.4;

                tempVec.set(x, y, z);
                tempVec.project(camera);

                // Ocultar si queda detrás de la cámara
                if (tempVec.z > 1) {
                    el.style.opacity = '0';
                    return;
                }

                const screenX = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
                const screenY = (-tempVec.y * 0.5 + 0.5) * window.innerHeight;

                el.style.transform = `translate(-50%, -50%) translate3d(${screenX}px, ${screenY}px, 0)`;

                // Efecto de desvanecimiento según profundidad
                const depthAlpha = Math.min(Math.max((1.2 - tempVec.z) * 1.2, 0.2), 1);
                el.style.opacity = depthAlpha.toString();
            });

            renderer.render(scene, camera);
        }

        animate();

        // Redimensión de pantalla
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
